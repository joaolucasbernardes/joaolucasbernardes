<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
  <defs>
    <clipPath id="win">
      <rect x="20" y="20" width="840" height="420" rx="14"/>
    </clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    :root { color-scheme: dark; }
    .green { fill: #00FF9C; }
    .cyan  { fill: #00E5FF; }
    .txt   { fill: #E6EDF3; }
    .dim   { fill: #8B949E; }

    .prompt { filter: drop-shadow(0 0 5px rgba(0,255,156,0.45)); }

    /* linhas escondidas até seu momento na sequência */
    .hid { opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* digitação: retângulo cor-de-fundo desliza para a direita em steps() */
    @keyframes ty1 { to { transform: translateX(187px); } }
    @keyframes ty2 { to { transform: translateX(264px); } }
    @keyframes ty3 { to { transform: translateX(302px); } }

    .l1 { animation: show 0.01s linear 0.4s forwards; }
    .c1 { animation: ty1 1.0s steps(18, end) 0.4s forwards; }

    .l2 { animation: fadein 0.35s ease-out 1.7s forwards; }

    .l3 { animation: show 0.01s linear 2.5s forwards; }
    .c3 { animation: ty2 1.2s steps(26, end) 2.5s forwards; }

    .l4 { animation: fadein 0.3s ease-out 4.0s forwards; }
    .l5 { animation: fadein 0.3s ease-out 4.25s forwards; }
    .l6 { animation: fadein 0.3s ease-out 4.5s forwards; }

    .l7 { animation: show 0.01s linear 5.3s forwards; }
    .c7 { animation: ty3 1.3s steps(30, end) 5.3s forwards; }

    .l8 { animation: fadein 0.4s ease-out 7.0s forwards; }

    .l9 { animation: show 0.01s linear 7.6s forwards; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: show 0.01s linear 7.6s forwards, blink 1.1s step-end 7.7s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hid, .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8, .l9 { animation: none; opacity: 1; }
      .c1, .c3, .c7 { display: none; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  <!-- ── janela do terminal ─────────────────────────────── -->
  <rect x="20" y="20" width="840" height="420" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <g clip-path="url(#win)">
    <!-- barra de título -->
    <rect x="20" y="20" width="840" height="38" fill="#161B22"/>
    <circle cx="46" cy="39" r="6" fill="#FF5F56"/>
    <circle cx="66" cy="39" r="6" fill="#FFBD2E"/>
    <circle cx="86" cy="39" r="6" fill="#27C93F"/>
    <text x="440" y="44" text-anchor="middle" font-size="13" class="dim">joao@backend: ~/joaolucasbernardes</text>

    <!-- ── sequência do terminal ──────────────────────────── -->

    <!-- $ whoami -->
    <g class="hid l1">
      <text x="48" y="100" textLength="173" class="prompt"><tspan class="green">joao@dev:~$ </tspan><tspan class="txt">whoami</tspan></text>
      <rect class="c1" x="46" y="84" width="187" height="22" fill="#0D1117"/>
    </g>
    <g class="hid l2">
      <text x="48" y="130" class="cyan">João Lucas Bernardes — Java Back-end Developer</text>
    </g>

    <!-- $ cat stack.conf -->
    <g class="hid l3">
      <text x="48" y="172" textLength="250" class="prompt"><tspan class="green">joao@dev:~$ </tspan><tspan class="txt">cat stack.conf</tspan></text>
      <rect class="c3" x="46" y="156" width="264" height="22" fill="#0D1117"/>
    </g>
    <g class="hid l4">
      <text x="48" y="202"><tspan class="green">[core]</tspan><tspan class="txt" dx="14">java · kotlin · spring-boot · hibernate</tspan></text>
    </g>
    <g class="hid l5">
      <text x="48" y="230"><tspan class="green">[data]</tspan><tspan class="txt" dx="14">postgresql · mysql · docker</tspan></text>
    </g>
    <g class="hid l6">
      <text x="48" y="258"><tspan class="green">[apis]</tspan><tspan class="txt" dx="14">rest · microsserviços · segurança</tspan></text>
    </g>

    <!-- $ ./deploy (mission) -->
    <g class="hid l7">
      <text x="48" y="300" textLength="288" class="prompt"><tspan class="green">joao@dev:~$ </tspan><tspan class="txt">./deploy --mission</tspan></text>
      <rect class="c7" x="46" y="284" width="302" height="22" fill="#0D1117"/>
    </g>
    <g class="hid l8">
      <text x="48" y="330"><tspan class="cyan">▸ </tspan><tspan class="txt">construindo soluções robustas, escaláveis e seguras…</tspan></text>
    </g>

    <!-- prompt final + cursor piscando -->
    <g class="hid l9">
      <text x="48" y="368" class="green prompt">joao@dev:~$</text>
    </g>
    <rect class="hid cursor" x="168" y="353" width="10" height="19" fill="#00FF9C"/>

    <!-- scanlines CRT sutis por cima de tudo -->
    <rect x="20" y="58" width="840" height="382" fill="url(#scan)"/>
  </g>
</svg>
